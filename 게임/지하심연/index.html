<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지하 심연 — 최종판</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="controls.css" />
</head>
<body>
  <main>
    <canvas id="screen" width="960" height="540" aria-label="지하 심연 게임 화면"></canvas>
    <section class="hud"><div id="armor">ARMOR 50</div><div id="health">VITAL 100</div><div id="ammo">SHELLS 32</div><div id="kills">THREATS 0 / 9</div></section>
    <div id="crosshair">+</div>
    <div id="message">침입 경보. 생존자를 제거하라.</div>
    <div class="input-controls" aria-label="입력 설정">
      <label>감도 <output id="sensitivity-value">45</output><input id="sensitivity" type="range" min="10" max="100" value="45"></label>
      <label>시점 부드러움 <output id="smoothness-value">55</output><input id="smoothness" type="range" min="0" max="100" value="55"></label>
    </div>
    <section id="intro" class="panel">
      <div class="panel-inner">
        <p class="tag">ORIGINAL ARENA SHOOTER · FINAL BUILD</p>
        <h1>지하 심연</h1>
        <p>폐기된 연구 시설의 마지막 생존자가 되어, 심연에서 올라온 생명체를 막아내세요.</p>
        <div class="controls"><span><b>WASD / ARROW</b> 이동</span><span><b>MOUSE</b> 시점 회전</span><span><b>RIGHT CLICK / SPACE</b> 산탄총 발사</span><span><b>R</b> 재장전</span><span><b>F</b> 전기 도끼</span></div>
        <p class="goal">적을 모두 제거하고, 격리실의 붉은 탈출 포털을 활성화하세요.</p>
        <button id="start" type="button">심연으로 진입 <small>CLICK TO LOCK MOUSE</small></button>
      </div>
    </section>
    <section id="end" class="panel hidden"><div class="panel-inner"><h2 id="end-title"></h2><p id="end-copy"></p><button id="restart" type="button">다시 진입</button></div></section>
  </main>
  <script src="game.js"></script>
</body>
</html>
